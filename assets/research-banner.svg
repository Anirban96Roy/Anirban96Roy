    <text x="60" y="162" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="65" font-weight="700" letter-spacing="-1.7" fill="#F5F8FF">Anirban Roy</text>
    <rect x="64" y="187" width="87" height="5" rx="2.5" fill="url(#accent)" />
    <text x="61" y="228" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#CBD9F0">Medical Imaging AI <tspan fill="#55DBC8">•</tspan> Trustworthy Learning</text>
    <text x="61" y="259" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#CBD9F0">Segmentation <tspan fill="#55DBC8">•</tspan> Self-Supervision <tspan fill="#55DBC8">•</tspan> Explainability</text>
