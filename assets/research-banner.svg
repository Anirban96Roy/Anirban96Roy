<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="346" viewBox="0 0 1200 346" role="img" aria-label="Anirban Roy. Research in Medical Imaging AI, Computer Vision and Trustworthy Machine Learning.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091425" />
      <stop offset="0.52" stop-color="#101A32" />
      <stop offset="1" stop-color="#13223F" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
