      <stop offset="1" stop-color="#7C9BFA" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#36D7C5" stop-opacity=".24" />
      <stop offset="1" stop-color="#36D7C5" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse">
      <path d="M27 0H0V27" fill="none" stroke="#BFD1FA" stroke-opacity=".065" stroke-width="1" />
    </pattern>
    <clipPath id="rounded"><rect width="1200" height="346" rx="23" ry="23" /></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
